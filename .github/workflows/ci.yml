name: CI

# CI 최소 게이트(docs/4 §4.2): 단위 + 통합 테스트.
# (lint 도구는 아직 미도입 — 도입 시 test 앞에 lint 단계 추가)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: team_caltalk
        ports:
          - 5432:5432
        # DB 준비 완료까지 대기
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/team_caltalk
      JWT_ACCESS_SECRET: ci-test-secret-please-use-long-random-in-prod
      JWT_ACCESS_TTL: 15m
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: silent

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # migrate:up 은 ../.env(루트)를 envPath 로 참조하므로 CI 에서 생성한다.
      - name: Create root .env for migrations
        working-directory: .
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "JWT_ACCESS_SECRET=$JWT_ACCESS_SECRET"
            echo "CORS_ORIGIN=$CORS_ORIGIN"
          } > .env

      - name: Run migrations
        run: npm run migrate:up

      - name: Run tests (unit + integration)
        run: npm test
