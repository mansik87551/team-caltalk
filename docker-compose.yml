# Team CalTalk 로컬 전체 스택 (postgres + server + client)
# 사용: docker compose up --build  →  http://localhost:8080
#
# 포트 매핑
#  - client(nginx) : http://localhost:8080
#  - server(API/WS): http://localhost:3000
#  - postgres      : localhost:5432
#
# 브라우저는 localhost:8080(client)에서 로드되어 localhost:3000(server)로 REST/WS 호출한다.
# 따라서 client 빌드의 VITE_API_BASE_URL=http://localhost:3000, server CORS_ORIGIN=http://localhost:8080 으로 맞춘다.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: team_caltalk
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d team_caltalk']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/team_caltalk
      JWT_ACCESS_SECRET: dev-docker-secret-change-me-with-32+chars-please
      JWT_ACCESS_TTL: 15m
      CORS_ORIGIN: http://localhost:8080
      LOG_LEVEL: info
      PORT: '3000'
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: http://localhost:3000
    ports:
      - '8080:80'
    depends_on:
      - server

volumes:
  pgdata:
